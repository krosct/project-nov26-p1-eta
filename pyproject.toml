[project]
name = "project-nov26-p1-eta"
version = "0.1.0"
description = "Modelo que prevê o tempo de entrega de um pedido de delivery a partir de distância, horário, clima e entregador, servido por uma API pronta para produção."
readme = "README.md"
authors = [
    { name = "Gabriel MS", email = "krosct@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # erros, imports, bugs comuns, sintaxe moderna

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
train = [
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
]
